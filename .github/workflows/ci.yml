name: 持续检查

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: 后端 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # 已核验的 v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # 已核验的 v6
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m unittest discover -s tests -v

  web:
    name: Web 构建与交互
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # 已核验的 v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # 已核验的 v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test

  linux-container:
    name: Linux 容器启动与持久化
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # 已核验的 v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # 已核验的 v6
        with:
          python-version: "3.14"
      - run: docker build -t storespark:ci .
      - name: 验证非 root 容器和业务接口
        env:
          STORESPARK_TEST_TOKEN: ci-only-storespark-access-token
        run: |
          docker run -d --name storespark-ci -e STORESPARK_ACCESS_TOKEN="$STORESPARK_TEST_TOKEN" -p 127.0.0.1:18000:8000 -v storespark-ci-data:/app/data storespark:ci
          test "$(docker inspect --format '{{.Config.User}}' storespark-ci)" = "10001:10001"
          python tests/container_smoke.py http://127.0.0.1:18000
          docker restart storespark-ci
          python tests/container_smoke.py http://127.0.0.1:18000 --restore
      - name: 保存失败日志并清理本轮容器
        if: always()
        run: |
          docker logs storespark-ci || true
          docker rm -f storespark-ci || true
          docker volume rm storespark-ci-data || true
