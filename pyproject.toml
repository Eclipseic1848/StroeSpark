[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "storespark"
version = "0.1.0"
description = "面向门店宣传任务的内容工作台"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.28,<1",
  "cryptography>=46,<50",
  "python-dotenv>=1,<2",
  "python-multipart>=0.0.20,<1",
  "Pillow>=12,<13",
]

[tool.setuptools.packages.find]
include = ["storespark*"]
